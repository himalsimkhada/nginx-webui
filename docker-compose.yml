services:
  nginx-webui:
    build: .
    container_name: nginx-webui
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-password}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      NGINX_CONF_DIR: /etc/nginx
      LOG_FILE: ${LOG_FILE:-}
      SERVICE_NAME: nginx-webui
    volumes:
      - /etc/nginx:/etc/nginx:rw
      - /var/log/nginx:/var/log/nginx:rw
      - /var/run/nginx.pid:/var/run/nginx.pid:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: false

  # Optional: a second instance-fronting "edge" nginx running inside the
  # container is NOT supported for reload/restart (those need the host binary
  # and a signal to the host master process). Config editing + `nginx -t`
  # work against the mounted config; reloads happen on the host.