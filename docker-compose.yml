services:
  nginx-webui:
    build: .
    container_name: nginx-webui
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-password}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      NGINX_CONF_DIR: /etc/nginx
      LOG_FILE: ${LOG_FILE:-}
      NGINX_STATUS_URL: ${NGINX_STATUS_URL:-}
      NGINX_CTL_URL: ${NGINX_CTL_URL:-}
      SERVICE_NAME: nginx-webui
    volumes:
      - /etc/nginx:/etc/nginx:rw
      - /var/log/nginx:/var/log/nginx:rw
      - /var/run/nginx.pid:/var/run/nginx.pid:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: false

  # The container edits the host's /etc/nginx (mounted above) but cannot
  # signal/restart the host nginx master. Run the host-side control agent
  # (host_agent.py, repo root, e.g. via nginx-webui-host-agent.service) on
  # the nginx host and set:
  #   NGINX_STATUS_URL=http://host.docker.internal:8080/nginx_status
  #   NGINX_CTL_URL=http://host.docker.internal:9401
  # so status, `nginx -t`, reload and restart act on the HOST nginx.